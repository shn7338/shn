<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c7cbd1"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #f4f4f5; }
      .node { fill: #303030; stroke: #4b4b4b; stroke-width: 1.5; }
      .node-v5 { fill: #34373b; stroke: #69717c; stroke-width: 1.8; }
      .node-out { fill: #303030; stroke: #50545a; stroke-width: 1.5; }
      .label { font-size: 21px; font-weight: 700; }
      .sub { font-size: 18px; font-weight: 500; fill: #e4e4e7; }
      .edge { fill: none; stroke: #c7cbd1; stroke-width: 1.45; opacity: 0.94; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="720" fill="#171717"/>

  <!-- Connectors are drawn first so nodes sit cleanly above them -->
  <!-- 建筑高度图 -> Stage 1 -->
  <path class="edge" d="M225 94 C430 94, 600 94, 835 94"/>
  <!-- 建筑高度图 -> Stage 2A -->
  <path class="edge" d="M225 137 C300 177, 390 177, 1080 177"/>
  <!-- 建筑高度图 -> 基站参数估计器 -->
  <path class="edge" d="M225 86 C285 66, 287 68, 305 112 L392 292"/>

  <!-- 稀疏信号点 -> 参数估计器 -->
  <path class="edge" d="M232 426 C276 390, 312 350, 342 340"/>
  <!-- 稀疏点掩码 -> 参数估计器 -->
  <path class="edge" d="M225 625 C290 603, 295 590, 325 525 L390 362"/>

  <!-- 参数估计器 -> 位置概率 -->
  <path class="edge" d="M510 317 C560 285, 595 250, 635 244"/>
  <!-- 参数估计器 -> 功率方向 -->
  <path class="edge" d="M510 330 C720 330, 850 330, 1100 330"/>
  <!-- 参数估计器 -> 辅助信号图 -->
  <path class="edge" d="M510 350 C560 410, 585 456, 1115 456"/>

  <!-- 位置概率 -> Stage 1 -->
  <path class="edge" d="M780 225 C825 212, 835 170, 878 138"/>
  <!-- 位置概率 -> V5 -->
  <path class="edge" d="M780 246 C1040 248, 1205 246, 1322 250 C1360 252, 1382 285, 1420 332"/>

  <!-- Stage 1 -> Stage 2A -->
  <path class="edge" d="M1035 100 C1060 100, 1070 106, 1100 117"/>
  <!-- Stage 2A -> V5 -->
  <path class="edge" d="M1290 145 C1328 145, 1330 162, 1352 210 L1438 330"/>

  <!-- 功率方向 -> V5 -->
  <path class="edge" d="M1310 330 C1340 330, 1360 344, 1382 357"/>
  <!-- 辅助信号图 -> V5 -->
  <path class="edge" d="M1305 456 C1350 456, 1362 428, 1390 408"/>

  <!-- 稀疏信号点 -> V5 -->
  <path class="edge" d="M232 455 C300 508, 310 530, 420 530 L1280 530 C1340 530, 1360 480, 1415 416"/>
  <!-- 稀疏点掩码 -> V5 -->
  <path class="edge" d="M225 640 C330 676, 430 675, 1280 675 C1348 675, 1352 580, 1440 416"/>

  <!-- V5 -> 完整信号图 -->
  <path class="edge" d="M1630 374 C1655 374, 1670 374, 1695 374"/>

  <!-- Nodes -->
  <g filter="url(#softShadow)">
    <rect class="node" x="55" y="55" width="170" height="90" rx="14"/>
    <rect class="node" x="22" y="395" width="210" height="62" rx="14"/>
    <rect class="node" x="55" y="600" width="170" height="62" rx="14"/>

    <rect class="node" x="305" y="292" width="205" height="70" rx="14"/>
    <rect class="node" x="590" y="205" width="190" height="62" rx="14"/>

    <rect class="node" x="835" y="54" width="200" height="90" rx="14"/>
    <rect class="node" x="1080" y="100" width="210" height="90" rx="14"/>
    <rect class="node" x="1100" y="296" width="210" height="68" rx="14"/>
    <rect class="node" x="1115" y="424" width="190" height="64" rx="14"/>

    <rect class="node-v5" x="1380" y="330" width="250" height="88" rx="15"/>
    <rect class="node-out" x="1695" y="330" width="205" height="88" rx="15"/>
  </g>

  <!-- Node labels -->
  <text x="140" y="91" text-anchor="middle" class="label">建筑高度图</text>
  <text x="140" y="120" text-anchor="middle" class="sub">128 × 128</text>

  <text x="127" y="434" text-anchor="middle" class="label">100 个稀疏信号点</text>
  <text x="140" y="639" text-anchor="middle" class="label">稀疏点掩码</text>

  <text x="407" y="335" text-anchor="middle" class="label">基站参数估计器</text>
  <text x="685" y="244" text-anchor="middle" class="label">估计位置概率图</text>

  <text x="935" y="88" text-anchor="middle" class="sub">Stage 1</text>
  <text x="935" y="118" text-anchor="middle" class="label">粗略各向同性图</text>

  <text x="1185" y="135" text-anchor="middle" class="sub">Stage 2-A</text>
  <text x="1185" y="164" text-anchor="middle" class="label">各向同性残差修正</text>

  <text x="1205" y="338" text-anchor="middle" class="label">估计功率与方向</text>
  <text x="1210" y="464" text-anchor="middle" class="label">辅助信号图</text>

  <text x="1505" y="362" text-anchor="middle" class="sub">Stage 2-B · V5</text>
  <text x="1505" y="390" text-anchor="middle" class="label">方向性与稀疏点融合</text>

  <text x="1797" y="360" text-anchor="middle" class="label">完整信号强度图</text>
  <text x="1797" y="389" text-anchor="middle" class="sub">128 × 128，单位 dB</text>
</svg>
